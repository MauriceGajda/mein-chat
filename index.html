<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Istok+Web:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Istok Web', sans-serif !important; 
        }
        
        html, body { 
            width: 100%; 
            height: 100%; 
            background-color: #001529; 
            overflow: hidden; 
        }

        #chat-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            background-color: #001529;
        }

        #chat { 
            flex: 1; 
            overflow-y: auto; 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            gap: 8px;
            background-color: #001529;
            -webkit-overflow-scrolling: touch; 
        }

        .msg { 
            background: rgba(255, 255, 255, 0.1); 
            padding: 8px 10px; 
            border-left: 5px solid #ffa500; 
            font-size: 14px; 
            word-wrap: break-word;
            color: #fdf0c2; 
        }

        .msg b { 
            color: #fdf0c2; 
            display: inline-flex;
            align-items: center;
            font-size: 13px; 
            margin-bottom: 2px; 
        }

        .verify-badge {
            color: #ffa500;
            font-size: 11px;
            margin-left: 4px;
            background: rgba(255, 165, 0, 0.2);
            padding: 1px 4px;
            border-radius: 3px;
            font-weight: bold;
            display: inline-block;
            vertical-align: middle;
        }

        #input-area { 
            background-color: #fdf0c2; 
            padding: 10px; 
            width: 100%;
            flex-shrink: 0;
        }

        .input-row { 
            display: flex; 
            gap: 5px; 
            width: 100%; 
        }

        input { 
            background: #fff; 
            border: none; 
            padding: 8px; 
            font-size: 14px; 
            font-weight: bold; 
            color: #333;
            outline: none;
            height: 40px;
            -webkit-appearance: none;
        }

        #userName { width: 85px; flex-shrink: 0; }
        #userMsg { flex: 1; min-width: 0; }
        .hp-field { display: none !important; }

        button { 
            background: #001529; 
            color: #fff; 
            border: none;
            padding: 0 15px; 
            height: 40px;
            cursor: pointer; 
            font-weight: bold;
        }

        #chat::-webkit-scrollbar { width: 6px; }
        #chat::-webkit-scrollbar-track { background: #001529; }
        #chat::-webkit-scrollbar-thumb { background: #fdf0c2; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="chat"></div>
    <div id="input-area">
        <div class="input-row">
            <input type="text" id="botCheck" class="hp-field" tabindex="-1" autocomplete="off">
            <input type="text" id="userName" placeholder="Name">
            <input type="text" id="userMsg" placeholder="Nachricht..." onkeypress="if(event.key === 'Enter') send()">
            <button id="sendBtn" onclick="send()">Senden</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCq3ryTxKbb3WGi06jH8EWAy6avUNw4Nuc",
        authDomain: "meinwebchat.firebaseapp.com",
        databaseURL: "https://meinwebchat-default-rtdb.europe-west1.firebasedatabase.app/",
        projectId: "meinwebchat",
        storageBucket: "meinwebchat.firebasestorage.app",
        messagingSenderId: "1026092671512",
        appId: "1:1026092671512:web:1b38e71d21be7d3983196d"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let isLocked = false;
    let lastSentMessage = ""; // Lokaler Speicher für den Duplikat-Filter

    if (!sessionStorage.getItem('chat_user_sid')) {
        sessionStorage.setItem('chat_user_sid', 'sid_' + Math.random().toString(36).substr(2, 9));
    }
    const mySessionId = sessionStorage.getItem('chat_user_sid');

    const blacklist = [
        "arsch", "idiot", "wichser", "schlampe", "hure", "bastard", "depp", "missgeburt", "pisser", "fotze", "nazi", "hitler", "neger", "penis", "vagina", "fick",
        "hurensohn", "arschloch", "wixxer", "schwachkopf", "vollidiot", "spast", "spasti", "missgeburt", "nutte", "fotzenknecht", "pissnelke", "sauhund", "schweinehund",
        "wichsgesicht", "kackbratze", "pissgesicht", "vollpfosten", "vollspast", "versager", "verpisst", "lutsch", "lutscher", "huren", "drecksau", "schandmaul",
        "kanake", "fotzkopf", "pimmel", "pimmelberger", "pimmellutscher", "kitty", "kiki", "kikki", "kicki", "hyatt", "homosau", "schwuchtel", "tunte", "saftsack"
    ]; 

    function containsBadWords(text) {
        const lowerText = text.toLowerCase();
        return blacklist.some(word => lowerText.includes(word));
    }

    function cleanName(name) {
        return name.toLowerCase().replace(/[^a-zA-ZäöüÄÖÜß]/g, "");
    }

    // RegEx zur Erkennung von Zeichen-Spam (mehr als 4 gleiche Zeichen am Stück)
    function hasLetterSpam(text) {
        return /(.)\1{4,}/.test(text);
    }

    function scrollToBottom() {
        const chat = document.getElementById('chat');
        chat.scrollTop = chat.scrollHeight;
    }

    function send() {
        if (isLocked) return;
        const nameInput = document.getElementById('userName');
        const msgInput = document.getElementById('userMsg');
        const sendBtn = document.getElementById('sendBtn');
        
        const enteredName = nameInput.value.trim();
        const enteredMsg = msgInput.value.trim();

        if (enteredName !== "" && enteredMsg !== "") {
            
            // 1. DUPLIKAT-FILTER
            if (enteredMsg.toLowerCase() === lastSentMessage.toLowerCase()) {
                msgInput.value = ""; // Text stillschweigend löschen
                return;
            }

            let triggerShadowBan = false;

            // 2. PRÜFUNG AUF TROLL-VERHALTEN (Wörter oder Zeichen-Spam)
            if (containsBadWords(enteredMsg) || containsBadWords(enteredName) || hasLetterSpam(enteredMsg)) {
                triggerShadowBan = true; // Stillschweigend als Troll markieren
            }

            isLocked = true;
            sendBtn.style.opacity = "0.5";

            const cleanedEntered = cleanName(enteredName);

            db.ref("messages").limitToLast(50).once("value", (snapshot) => {
                let nameTakenByOther = false;

                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        const msgData = childSnapshot.val();
                        // Vergleiche Namen nur mit echten Nachrichten (nicht mit Shadowbanned-Einträgen)
                        if (msgData && msgData.sid && msgData.name && !msgData.shadowBanned && msgData.sid !== mySessionId) {
                            const cleanedExisting = cleanName(msgData.name);
                            if (cleanedExisting === cleanedEntered || 
                                (cleanedEntered.startsWith(cleanedExisting) && cleanedExisting.length >= 3)) {
                                nameTakenByOther = true;
                            }
                        }
                    });
                }

                // Eine echte Namensdopplung abweisen, außer der User wird eh shadowbanned
                if (nameTakenByOther && !triggerShadowBan) {
                    alert("Dieser Name oder eine zu ähnliche Variante wird aktuell bereits verwendet. Bitte wähle einen eindeutigen Namen.");
                    isLocked = false;
                    sendBtn.style.opacity = "1";
                    return;
                }

                // Nachricht in die Firebase-Datenbank schreiben
                db.ref("messages").push().set({
                    name: enteredName,
                    text: enteredMsg,
                    time: Date.now(),
                    sid: mySessionId,
                    shadowBanned: triggerShadowBan
                });

                lastSentMessage = enteredMsg; // Speichern für den Duplikat-Filter
                msgInput.value = "";
                setTimeout(() => { isLocked = false; sendBtn.style.opacity = "1"; }, 3000);
            });
        }
    }

    db.ref("messages").limitToLast(50).on("value", (snapshot) => {
        const chat = document.getElementById('chat');
        chat.innerHTML = ""; 
        
        if (!snapshot.exists()) {
            return;
        }

        const firstOwners = {};

        // 1. DURCHLAUF: Wer hält die echten Namensrechte (Shadowbanned User ignorieren)
        snapshot.forEach((childSnapshot) => {
            const data = childSnapshot.val();
            if (data && data.name && data.sid && !data.shadowBanned) {
                const cleaned = cleanName(data.name);
                if (!firstOwners[cleaned]) {
                    firstOwners[cleaned] = data.sid;
                }
            }
        });

        // 2. DURCHLAUF: Chatnachrichten auf den Bildschirmen rendern
        snapshot.forEach((childSnapshot) => {
            const data = childSnapshot.val();
            if (data && data.name && data.text) {
                
                // SCHATTENGEFÄNGNIS-LOGIK: Überspringen, außer man ist selbst der betroffene Absender
                if (data.shadowBanned && data.sid !== mySessionId) {
                    return; 
                }

                const cleaned = cleanName(data.name);
                const div = document.createElement('div');
                div.className = 'msg';
                
                // Haken-Badge wird nur an nicht-shadowbanned Erstbesitzer vergeben
                const hasBadge = (!data.shadowBanned && firstOwners[cleaned] === data.sid) ? '<span class="verify-badge">✔</span>' : '';
                
                div.innerHTML = `<b>${data.name}${hasBadge}</b> ${data.text}`;
                chat.appendChild(div);
            }
        });
        
        setTimeout(scrollToBottom, 50);
    });
</script>
</body>
</html>
