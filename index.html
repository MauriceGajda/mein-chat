<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Istok+Web:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Istok Web', sans-serif !important; 
        }
        
        html, body { 
            width: 100%; 
            height: 100%; 
            background-color: #001529; 
            overflow: hidden; 
        }

        #chat-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            background-color: #001529;
        }

        #chat { 
            flex: 1; 
            overflow-y: auto; 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            gap: 8px;
            background-color: #001529;
            -webkit-overflow-scrolling: touch; 
        }

        .msg { 
            background: rgba(255, 255, 255, 0.1); 
            padding: 8px 10px; 
            border-left: 5px solid #ffa500; 
            font-size: 14px; 
            word-wrap: break-word;
            color: #fdf0c2; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .msg-content { flex: 1; }

        .msg b { 
            color: #fdf0c2; 
            display: inline-flex;
            align-items: center;
            font-size: 13px; 
            margin-bottom: 2px; 
        }

        .verify-badge {
            color: #ffa500;
            font-size: 11px;
            margin-left: 4px;
            background: rgba(255, 165, 0, 0.2);
            padding: 1px 4px;
            border-radius: 3px;
            font-weight: bold;
        }

        .host-badge {
            color: #001529;
            font-size: 10px;
            margin-left: 5px;
            background: #ffa500;
            padding: 1px 5px;
            border-radius: 3px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 0 4px rgba(255, 165, 0, 0.4);
        }

        .admin-actions {
            display: none;
            gap: 8px;
            margin-left: 10px;
        }
        
        .admin-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 2px 5px;
            border-radius: 3px;
            height: auto;
        }
        .admin-btn:hover { background: rgba(255,255,255,0.2); }

        #admin-panel {
            display: none;
            background: #ffa500;
            color: #001529;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            justify-content: space-between;
            align-items: center;
        }

        #auth-panel {
            display: none;
            background: #002244;
            padding: 8px 10px;
            border-top: 1px solid rgba(255, 165, 0, 0.3);
            gap: 5px;
            flex-direction: column;
        }

        #auth-panel .auth-row {
            display: flex;
            gap: 5px;
            width: 100%;
        }

        #auth-panel input {
            height: 32px;
            font-size: 12px;
        }

        #auth-panel button {
            height: 32px;
            font-size: 11px;
            padding: 0 10px;
        }

        #input-area { 
            background-color: #fdf0c2; 
            padding: 10px; 
            width: 100%;
            flex-shrink: 0;
        }

        .input-row { 
            display: flex; 
            gap: 5px; 
            width: 100%; 
        }

        input { 
            background: #fff; 
            border: none; 
            padding: 8px; 
            font-size: 14px; 
            font-weight: bold; 
            color: #333;
            outline: none;
            height: 40px;
            -webkit-appearance: none;
        }

        #userName { width: 85px; flex-shrink: 0; }
        #userMsg { flex: 1; min-width: 0; }
        .hp-field { display: none !important; }

        button { 
            background: #001529; 
            color: #fff; 
            border: none;
            padding: 0 12px; 
            height: 40px;
            cursor: pointer; 
            font-weight: bold;
        }

        #loginToggleBtn {
            background: transparent;
            color: #001529;
            border: 1px solid #001529;
            font-size: 14px;
            padding: 0 8px;
        }

        #chat::-webkit-scrollbar { width: 6px; }
        #chat::-webkit-scrollbar-track { background: #001529; }
        #chat::-webkit-scrollbar-thumb { background: #fdf0c2; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="chat"></div>
    
    <div id="admin-panel">
        <span>🔒 Moderations-Modus aktiv</span>
        <button onclick="clearAllMessages()" style="background:#001529; color:#fff; font-size:10px; height:24px; padding:0 8px;">Kompletten Chat leeren</button>
    </div>

    <!-- Stammgast Login- / Registrier-Leiste -->
    <div id="auth-panel">
        <div class="auth-row">
            <input type="text" id="regName" placeholder="Wunschname" style="width: 35%;">
            <input type="password" id="regPass" placeholder="Passwort" style="flex:1;">
        </div>
        <div class="auth-row" style="justify-content: flex-end;">
            <button onclick="loginAccount()" style="background:#ffa500; color:#001529;">Login</button>
            <button onclick="registerAccount()" style="background:#001529; color:#fff; border:1px solid #ffa500;">Name Registrieren</button>
        </div>
    </div>

    <div id="input-area">
        <div class="input-row">
            <input type="text" id="botCheck" class="hp-field" tabindex="-1" autocomplete="off">
            <button id="loginToggleBtn" onclick="toggleAuthPanel()" title="Stammgast Login / Registrierung">🔒</button>
            <input type="text" id="userName" placeholder="Name">
            <input type="text" id="userMsg" placeholder="Nachricht..." onkeypress="if(event.key === 'Enter') send()">
            <button id="sendBtn" onclick="send()">Senden</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCq3ryTxKbb3WGi06jH8EWAy6avUNw4Nuc",
        authDomain: "meinwebchat.firebaseapp.com",
        databaseURL: "https://meinwebchat-default-rtdb.europe-west1.firebasedatabase.app/",
        projectId: "meinwebchat",
        storageBucket: "meinwebchat.firebasestorage.app",
        messagingSenderId: "1026092671512",
        appId: "1:1026092671512:web:1b38e71d21be7d3983196d"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let isLocked = false;
    let lastSentMessage = "";
    let amILoggedInAsAdmin = false;
    let loggedInUser = null; 

    if (!sessionStorage.getItem('chat_user_sid')) {
        sessionStorage.setItem('chat_user_sid', 'sid_' + Math.random().toString(36).substr(2, 9));
    }
    const mySessionId = sessionStorage.getItem('chat_user_sid');

    const blacklist = [
        "arsch", "idiot", "wichser", "schlampe", "hure", "bastard", "depp", "missgeburt", "pisser", "fotze", "nazi", "hitler", "neger", "penis", "vagina", "fick",
        "hurensohn", "arschloch", "wixxer", "schwachkopf", "vollidiot", "spast", "spasti", "missgeburt", "nutte", "fotzenknecht", "pissnelke", "sauhund", "schweinehund",
        "wichsgesicht", "kackbratze", "pissgesicht", "vollpfosten", "vollspast", "versager", "verpisst", "lutsch", "lutscher", "huren", "drecksau", "schandmaul",
        "kanake", "fotzkopf", "pimmel", "pimmelberger", "pimmellutscher", "saftsack"
    ]; 

    // Feste Host- & VIP-Namen für den Code 1104
    const protectedNames = [
        "maurice", "yvonne", "trl", "talknow", "total reality live", "totalrealitylive",
        "milan", "kiki", "hitler", "adolf hitler", "alice weidel", "björn höcke", "bjoern hoecke", "frauke petry"
    ];
    const secretCode = "_1104";

    function toggleAuthPanel() {
        const panel = document.getElementById("auth-panel");
        const toggleBtn = document.getElementById("loginToggleBtn");
        
        if (panel.style.display === "flex") {
            panel.style.display = "none";
            toggleBtn.style.background = "transparent";
            toggleBtn.style.color = "#001529";
        } else {
            panel.style.display = "flex";
            toggleBtn.style.background = "#001529";
            toggleBtn.style.color = "#ffa500";
        }
    }

    function containsBadWords(text) {
        const lowerText = text.toLowerCase();
        return blacklist.some(word => lowerText.includes(word));
    }

    function cleanName(name) {
        return name.toLowerCase().replace(/[^a-zA-ZäöüÄÖÜß]/g, "");
    }

    function hasLetterSpam(text) {
        return /(.)\1{4,}/.test(text);
    }

    function scrollToBottom() {
        const chat = document.getElementById('chat');
        chat.scrollTop = chat.scrollHeight;
    }

    // --- FREIWILLIGE REGISTRIERUNG FÜR STAMMGÄSTE ---
    function registerAccount() {
        const name = document.getElementById("regName").value.trim();
        const pass = document.getElementById("regPass").value.trim();

        if (name === "" || pass === "") {
            alert("Bitte Name und Passwort für die Registrierung eingeben.");
            return;
        }

        if (containsBadWords(name)) {
            alert("Dieser Name enthält unzulässige Begriffe.");
            return;
        }

        const cleanKey = cleanName(name);

        // Prüfen, ob der Name zu den festen Host-Namen gehört
        if (protectedNames.includes(cleanKey)) {
            alert("Dieser Name ist geschützt und kann nicht frei registriert werden.");
            return;
        }

        db.ref("users/" + cleanKey).once("value", (snapshot) => {
            if (snapshot.exists()) {
                alert("Dieser Name wurde bereits von einem anderen Stammgast gesichert!");
            } else {
                db.ref("users/" + cleanKey).set({
                    displayName: name,
                    password: pass
                }, (error) => {
                    if (!error) {
                        alert(`Erfolgreich registriert! Du kannst dich jetzt als "${name}" einloggen.`);
                    } else {
                        alert("Fehler bei der Registrierung.");
                    }
                });
            }
        });
    }

    // --- STAMMGAST LOGIN ---
    function loginAccount() {
        const name = document.getElementById("regName").value.trim();
        const pass = document.getElementById("regPass").value.trim();
        const cleanKey = cleanName(name);

        if (name === "" || pass === "") {
            alert("Bitte Name und Passwort eingeben.");
            return;
        }

        db.ref("users/" + cleanKey).once("value", (snapshot) => {
            if (!snapshot.exists()) {
                alert("Name nicht registriert. Bitte klicke erst auf 'Name Registrieren'.");
                return;
            }

            const userData = snapshot.val();
            if (userData.password !== pass) {
                alert("Falsches Passwort!");
                return;
            }

            loggedInUser = {
                name: userData.displayName || name
            };

            document.getElementById("userName").value = loggedInUser.name;
            document.getElementById("userName").readOnly = true;

            alert(`Willkommen zurück, ${loggedInUser.name}! Du bist jetzt verifiziert.`);
            toggleAuthPanel();
        });
    }

    function deleteMessage(msgId) {
        if(confirm("Nachricht wirklich löschen?")) {
            db.ref("messages/" + msgId).remove();
        }
    }

    function banUser(userSid, userName) {
        if(confirm(`Nutzer "${userName}" dauerhaft sperren?`)) {
            db.ref("banned_sids/" + userSid).set(true);
            db.ref("messages").once("value", (snapshot) => {
                if(snapshot.exists()) {
                    snapshot.forEach((child) => {
                        if(child.val().sid === userSid) {
                            db.ref("messages/" + child.key).remove();
                        }
                    });
                }
            });
        }
    }

    function clearAllMessages() {
        if(confirm("KOMPLETTEN Chatverlauf leeren?")) {
            db.ref("messages").remove();
        }
    }

    db.ref("banned_sids/" + mySessionId).on("value", (snapshot) => {
        if (snapshot.exists()) {
            isLocked = true;
            document.getElementById("sendBtn").disabled = true;
            document.getElementById("userMsg").placeholder = "Du wurdest aus dem Chat ausgeschlossen.";
            document.getElementById("userMsg").disabled = true;
        }
    });

    function send() {
        if (isLocked) return;
        const nameInput = document.getElementById('userName');
        const msgInput = document.getElementById('userMsg');
        
        let enteredName = nameInput.value.trim();
        const enteredMsg = msgInput.value.trim();

        if (enteredName !== "" && enteredMsg !== "") {
            
            if (enteredMsg.toLowerCase() === lastSentMessage.toLowerCase()) {
                msgInput.value = "";
                return;
            }

            let triggerShadowBan = false;
            if (containsBadWords(enteredMsg) || containsBadWords(enteredName) || hasLetterSpam(enteredMsg)) {
                triggerShadowBan = true;
            }

            let isVerifiedHost = false;
            let checkName = enteredName.toLowerCase();

            // 1. ANMELDUNG FÜR HOSTS VIA CODE 1104
            if (checkName.endsWith(secretCode)) {
                const baseName = enteredName.substring(0, enteredName.length - secretCode.length);
                const cleanBase = baseName.trim().toLowerCase();

                if (protectedNames.includes(cleanBase)) {
                    isVerifiedHost = true;
                    enteredName = baseName.trim();
                    checkName = cleanBase;

                    // Admin-Konsole aktivieren
                    amILoggedInAsAdmin = true;
                    document.getElementById("admin-panel").style.display = "flex";
                }
            } else if (loggedInUser) {
                // 2. STAMMGAST SCHREIBT EINGELOGGT
                executeSend(loggedInUser.name, enteredMsg, triggerShadowBan, false, true);
                return;
            } else {
                // 3. GAST PRÜFUNG: Ist der Name geschützt oder bereits von einem Stammgast registriert?
                const cleanedEnteredCheck = cleanName(enteredName);
                
                // Prüfen ob Host-Name
                const isHostProtected = protectedNames.some(pName => {
                    const cleanedPName = cleanName(pName);
                    return cleanedEnteredCheck === cleanedPName || 
                           (cleanedEnteredCheck.startsWith(cleanedPName) && cleanedPName.length >= 3);
                });

                if (isHostProtected) {
                    alert("Dieser Name ist geschützt.");
                    return;
                }

                // Prüfen ob in der Stammgast-Datenbank registriert
                db.ref("users/" + cleanedEnteredCheck).once("value", (userSnap) => {
                    if (userSnap.exists()) {
                        alert("Dieser Name gehört einem registrierten Stammgast. Bitte klicke auf das Schloss (🔒), um dich einzuloggen, oder wähle einen anderen Namen.");
                        return;
                    }

                    // Reiner Gast sendet ohne Badge
                    executeSend(enteredName, enteredMsg, triggerShadowBan, false, false);
                });
                return;
            }

            executeSend(enteredName, enteredMsg, triggerShadowBan, isVerifiedHost, false);
        }
    }

    function executeSend(name, text, shadowBanned, isHost, isVerified) {
        const sendBtn = document.getElementById('sendBtn');
        const msgInput = document.getElementById('userMsg');

        isLocked = true;
        sendBtn.style.opacity = "0.5";

        db.ref("messages").push().set({
            name: name,
            text: text,
            time: Date.now(),
            sid: mySessionId,
            shadowBanned: shadowBanned,
            isHost: isHost,
            isVerified: isVerified
        });

        lastSentMessage = text;
        msgInput.value = "";
        setTimeout(() => { isLocked = false; sendBtn.style.opacity = "1"; }, 3000);
    }

    db.ref("messages").limitToLast(50).on("value", (snapshot) => {
        const chat = document.getElementById('chat');
        chat.innerHTML = ""; 
        
        if (!snapshot.exists()) {
            return;
        }

        snapshot.forEach((childSnapshot) => {
            const msgId = childSnapshot.key;
            const data = childSnapshot.val();
            
            if (data && data.name && data.text) {
                
                if (data.shadowBanned && data.sid !== mySessionId && !amILoggedInAsAdmin) {
                    return; 
                }

                const div = document.createElement('div');
                div.className = 'msg';
                
                let badgeHTML = '';
                if (data.isHost) {
                    badgeHTML = '<span class="host-badge">Host</span>';
                } else if (data.isVerified) {
                    badgeHTML = '<span class="verify-badge">✔</span>';
                }
                
                let shadowHint = (data.shadowBanned && amILoggedInAsAdmin) ? ' <i style="color:red; font-size:11px;">(Shadowbanned)</i>' : '';
                
                div.innerHTML = `
                    <div class="msg-content">
                        <b>${data.name}${badgeHTML}${shadowHint}</b> <span style="color:#fff;">${data.text}</span>
                    </div>
                    <div class="admin-actions" id="actions-${msgId}">
                        <button class="admin-btn" title="Nachricht löschen" onclick="deleteMessage('${msgId}')">🗑️</button>
                        <button class="admin-btn" title="Nutzer sperren" onclick="banUser('${data.sid}', '${data.name}')">🚫</button>
                    </div>
                `;
                
                chat.appendChild(div);

                if (amILoggedInAsAdmin) {
                    document.getElementById(`actions-${msgId}`).style.display = 'flex';
                }
            }
        });
        
        setTimeout(scrollToBottom, 50);
    });
</script>
</body>
</html>
