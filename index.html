<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Istok+Web:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Istok Web', sans-serif !important; 
        }
        
        html, body { 
            width: 100%; 
            height: 100%; 
            background-color: #001529; 
            overflow: hidden; 
        }

        #chat-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            background-color: #001529;
        }

        #chat { 
            flex: 1; 
            overflow-y: auto; 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            gap: 8px;
            background-color: #001529;
            -webkit-overflow-scrolling: touch; 
        }

        .msg { 
            background: rgba(255, 255, 255, 0.1); 
            padding: 8px 10px; 
            border-left: 5px solid #ffa500; 
            font-size: 14px; 
            word-wrap: break-word;
            color: #fdf0c2; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .msg-content { flex: 1; }

        .msg b { 
            color: #fdf0c2; 
            display: inline-flex;
            align-items: center;
            font-size: 13px; 
            margin-bottom: 2px; 
        }

        .verify-badge {
            color: #ffa500;
            font-size: 11px;
            margin-left: 4px;
            background: rgba(255, 165, 0, 0.2);
            padding: 1px 4px;
            border-radius: 3px;
            font-weight: bold;
        }

        .host-badge {
            color: #001529;
            font-size: 10px;
            margin-left: 5px;
            background: #ffa500;
            padding: 1px 5px;
            border-radius: 3px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 0 4px rgba(255, 165, 0, 0.4);
        }

        .admin-actions {
            display: none;
            gap: 8px;
            margin-left: 10px;
        }
        
        .admin-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 2px 5px;
            border-radius: 3px;
            height: auto;
        }
        .admin-btn:hover { background: rgba(255,255,255,0.2); }

        #admin-panel {
            display: none;
            background: #ffa500;
            color: #001529;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            justify-content: space-between;
            align-items: center;
        }

        #input-area { 
            background-color: #fdf0c2; 
            padding: 10px; 
            width: 100%;
            flex-shrink: 0;
        }

        .input-row { 
            display: flex; 
            gap: 5px; 
            width: 100%; 
        }

        input { 
            background: #fff; 
            border: none; 
            padding: 8px; 
            font-size: 14px; 
            font-weight: bold; 
            color: #333;
            outline: none;
            height: 40px;
            -webkit-appearance: none;
        }

        #userName { width: 85px; flex-shrink: 0; }
        #userPass { width: 85px; flex-shrink: 0; display: none; }
        #userMsg { flex: 1; min-width: 0; }
        .hp-field { display: none !important; }

        button { 
            background: #001529; 
            color: #fff; 
            border: none;
            padding: 0 12px; 
            height: 40px;
            cursor: pointer; 
            font-weight: bold;
        }

        #loginToggleBtn {
            background: transparent;
            color: #001529;
            border: 1px solid #001529;
            font-size: 14px;
            padding: 0 8px;
        }

        #chat::-webkit-scrollbar { width: 6px; }
        #chat::-webkit-scrollbar-track { background: #001529; }
        #chat::-webkit-scrollbar-thumb { background: #fdf0c2; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="chat"></div>
    
    <div id="admin-panel">
        <span>🔒 Moderations-Modus aktiv</span>
        <button onclick="clearAllMessages()" style="background:#001529; color:#fff; font-size:10px; height:24px; padding:0 8px;">Kompletten Chat leeren</button>
    </div>

    <div id="input-area">
        <div class="input-row">
            <input type="text" id="botCheck" class="hp-field" tabindex="-1" autocomplete="off">
            <button id="loginToggleBtn" onclick="toggleLoginMode()" title="Login für Stammnutzer & Hosts">🔒</button>
            <input type="text" id="userName" placeholder="Name">
            <input type="password" id="userPass" placeholder="Passwort">
            <input type="text" id="userMsg" placeholder="Nachricht..." onkeypress="if(event.key === 'Enter') send()">
            <button id="sendBtn" onclick="send()">Senden</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCq3ryTxKbb3WGi06jH8EWAy6avUNw4Nuc",
        authDomain: "meinwebchat.firebaseapp.com",
        databaseURL: "https://meinwebchat-default-rtdb.europe-west1.firebasedatabase.app/",
        projectId: "meinwebchat",
        storageBucket: "meinwebchat.firebasestorage.app",
        messagingSenderId: "1026092671512",
        appId: "1:1026092671512:web:1b38e71d21be7d3983196d"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let isLocked = false;
    let lastSentMessage = "";
    let amILoggedInAsAdmin = false;
    let isLoginModeActive = false;

    if (!sessionStorage.getItem('chat_user_sid')) {
        sessionStorage.setItem('chat_user_sid', 'sid_' + Math.random().toString(36).substr(2, 9));
    }
    const mySessionId = sessionStorage.getItem('chat_user_sid');

    const blacklist = [
        "arsch", "idiot", "wichser", "schlampe", "hure", "bastard", "depp", "missgeburt", "pisser", "fotze", "nazi", "hitler", "neger", "penis", "vagina", "fick",
        "hurensohn", "arschloch", "wixxer", "schwachkopf", "vollidiot", "spast", "spasti", "missgeburt", "nutte", "fotzenknecht", "pissnelke", "sauhund", "schweinehund",
        "wichsgesicht", "kackbratze", "pissgesicht", "vollpfosten", "vollspast", "versager", "verpisst", "lutsch", "lutscher", "huren", "drecksau", "schandmaul",
        "kanake", "fotzkopf", "pimmel", "pimmelberger", "hyat", "hyatt", "kiki", "kiki oder kartsen", "kikioderkarsten", "afd", "petry", "pimmellutscher", "saftsack"
    ]; 

    const protectedNames = [
        "maurice", "yvonne", "trl", "talknow", "total reality live", "totalrealitylive",
        "milan", "kiki", "hitler", "adolf hitler", "alice weidel", "björn höcke", "bjoern hoecke", "frauke petry"
    ];

    function toggleLoginMode() {
        isLoginModeActive = !isLoginModeActive;
        const passInput = document.getElementById("userPass");
        const toggleBtn = document.getElementById("loginToggleBtn");
        
        if (isLoginModeActive) {
            passInput.style.display = "block";
            toggleBtn.style.background = "#001529";
            toggleBtn.style.color = "#ffa500";
        } else {
            passInput.style.display = "none";
            toggleBtn.style.background = "transparent";
            toggleBtn.style.color = "#001529";
        }
    }

    function containsBadWords(text) {
        const lowerText = text.toLowerCase();
        return blacklist.some(word => lowerText.includes(word));
    }

    function cleanName(name) {
        return name.toLowerCase().replace(/[^a-zA-ZäöüÄÖÜß]/g, "");
    }

    function hasLetterSpam(text) {
        return /(.)\1{4,}/.test(text);
    }

    function scrollToBottom() {
        const chat = document.getElementById('chat');
        chat.scrollTop = chat.scrollHeight;
    }

    function deleteMessage(msgId) {
        if(confirm("Nachricht wirklich löschen?")) {
            db.ref("messages/" + msgId).remove();
        }
    }

    function banUser(userSid, userName) {
        if(confirm(`Nutzer "${userName}" dauerhaft sperren?`)) {
            db.ref("banned_sids/" + userSid).set(true);
            db.ref("messages").once("value", (snapshot) => {
                if(snapshot.exists()) {
                    snapshot.forEach((child) => {
                        if(child.val().sid === userSid) {
                            db.ref("messages/" + child.key).remove();
                        }
                    });
                }
            });
        }
    }

    function clearAllMessages() {
        if(confirm("KOMPLETTEN Chatverlauf leeren?")) {
            db.ref("messages").remove();
        }
    }

    db.ref("banned_sids/" + mySessionId).on("value", (snapshot) => {
        if (snapshot.exists()) {
            isLocked = true;
            document.getElementById("sendBtn").disabled = true;
            document.getElementById("userMsg").placeholder = "Du wurdest aus dem Chat ausgeschlossen.";
            document.getElementById("userMsg").disabled = true;
        }
    });

    function send() {
        if (isLocked) return;
        const nameInput = document.getElementById('userName');
        const passInput = document.getElementById('userPass');
        const msgInput = document.getElementById('userMsg');
        const sendBtn = document.getElementById('sendBtn');
        
        let enteredName = nameInput.value.trim();
        const enteredPass = passInput.value.trim();
        const enteredMsg = msgInput.value.trim();

        if (enteredName !== "" && enteredMsg !== "") {
            
            if (enteredMsg.toLowerCase() === lastSentMessage.toLowerCase()) {
                msgInput.value = "";
                return;
            }

            let triggerShadowBan = false;
            if (containsBadWords(enteredMsg) || containsBadWords(enteredName) || hasLetterSpam(enteredMsg)) {
                triggerShadowBan = true;
            }

            const cleanedEnteredCheck = cleanName(enteredName);
            const isProtected = protectedNames.some(pName => cleanName(pName) === cleanedEnteredCheck);

            // Prüfe, ob es ein geschützter Name ohne Passwort-Login ist
            if (isProtected && (!isLoginModeActive || enteredPass === "")) {
                alert("Dieser Name ist geschützt. Bitte klicke auf das Schloss-Symbol (🔒) und gib dein Passwort ein.");
                return;
            }

            isLocked = true;
            sendBtn.style.opacity = "0.5";

            // Wenn Passwort eingegeben wurde, prüfe gegen die Firebase-Benutzerdatenbank (`users`)
            if (isLoginModeActive && enteredPass !== "") {
                const userKey = cleanedEnteredCheck;
                
                db.ref("users/" + userKey).once("value", (userSnap) => {
                    if (!userSnap.exists()) {
                        alert("Benutzername nicht registriert oder falsches Passwort.");
                        isLocked = false;
                        sendBtn.style.opacity = "1";
                        return;
                    }

                    const userData = userSnap.val();
                    if (userData.password !== enteredPass) {
                        alert("Falsches Passwort!");
                        isLocked = false;
                        sendBtn.style.opacity = "1";
                        return;
                    }

                    // Erfolgreicher Login
                    let isHostRole = (userData.role === "admin" || userData.role === "host");
                    if (isHostRole) {
                        amILoggedInAsAdmin = true;
                        document.getElementById("admin-panel").style.display = "flex";
                    }

                    pushMessage(enteredName, enteredMsg, triggerShadowBan, isHostRole, true);
                });
            } else {
                // Anonymer Gast-Sende-Vorgang
                pushMessage(enteredName, enteredMsg, triggerShadowBan, false, false);
            }
        }
    }

    function pushMessage(name, text, shadowBanned, isHost, isVerified) {
        const sendBtn = document.getElementById('sendBtn');
        const msgInput = document.getElementById('userMsg');

        db.ref("messages").push().set({
            name: name,
            text: text,
            time: Date.now(),
            sid: mySessionId,
            shadowBanned: shadowBanned,
            isHost: isHost,
            isVerified: isVerified
        });

        lastSentMessage = text;
        msgInput.value = "";
        setTimeout(() => { isLocked = false; sendBtn.style.opacity = "1"; }, 3000);
    }

    db.ref("messages").limitToLast(50).on("value", (snapshot) => {
        const chat = document.getElementById('chat');
        chat.innerHTML = ""; 
        
        if (!snapshot.exists()) {
            return;
        }

        snapshot.forEach((childSnapshot) => {
            const msgId = childSnapshot.key;
            const data = childSnapshot.val();
            
            if (data && data.name && data.text) {
                
                if (data.shadowBanned && data.sid !== mySessionId && !amILoggedInAsAdmin) {
                    return; 
                }

                const div = document.createElement('div');
                div.className = 'msg';
                
                let badgeHTML = '';
                if (data.isHost) {
                    badgeHTML = '<span class="host-badge">Host</span>';
                } else if (data.isVerified) {
                    badgeHTML = '<span class="verify-badge">✔</span>';
                }
                
                let shadowHint = (data.shadowBanned && amILoggedInAsAdmin) ? ' <i style="color:red; font-size:11px;">(Shadowbanned)</i>' : '';
                
                div.innerHTML = `
                    <div class="msg-content">
                        <b>${data.name}${badgeHTML}${shadowHint}</b> <span style="color:#fff;">${data.text}</span>
                    </div>
                    <div class="admin-actions" id="actions-${msgId}">
                        <button class="admin-btn" title="Nachricht löschen" onclick="deleteMessage('${msgId}')">🗑️</button>
                        <button class="admin-btn" title="Nutzer sperren" onclick="banUser('${data.sid}', '${data.name}')">🚫</button>
                    </div>
                `;
                
                chat.appendChild(div);

                if (amILoggedInAsAdmin) {
                    document.getElementById(`actions-${msgId}`).style.display = 'flex';
                }
            }
        });
        
        setTimeout(scrollToBottom, 50);
    });
</script>
</body>
</html>
