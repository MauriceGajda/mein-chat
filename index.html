<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Istok+Web:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Istok Web', sans-serif !important; 
        }
        
        html, body { 
            width: 100%; 
            height: 100%; 
            background-color: #001529; 
            overflow: hidden; 
        }

        #chat-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            background-color: #001529;
        }

        #chat { 
            flex: 1; 
            overflow-y: auto; 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            gap: 8px;
            background-color: #001529;
            -webkit-overflow-scrolling: touch; 
        }

        .msg { 
            background: rgba(255, 255, 255, 0.1); 
            padding: 8px 10px; 
            border-left: 5px solid #ffa500; 
            font-size: 14px; 
            word-wrap: break-word;
            color: #fdf0c2; 
        }

        .msg b { 
            color: #fdf0c2; 
            display: inline-flex;
            align-items: center;
            font-size: 13px; 
            margin-bottom: 2px; 
        }

        .verify-badge {
            color: #ffa500;
            font-size: 11px;
            margin-left: 4px;
            background: rgba(255, 165, 0, 0.2);
            padding: 1px 4px;
            border-radius: 3px;
            font-weight: bold;
            display: inline-block;
            vertical-align: middle;
        }

        .host-badge {
            color: #001529;
            font-size: 10px;
            margin-left: 5px;
            background: #ffa500;
            padding: 1px 5px;
            border-radius: 3px;
            font-weight: bold;
            text-transform: uppercase;
            display: inline-block;
            vertical-align: middle;
            box-shadow: 0 0 4px rgba(255, 165, 0, 0.4);
        }

        #input-area { 
            background-color: #fdf0c2; 
            padding: 10px; 
            width: 100%;
            flex-shrink: 0;
        }

        .input-row { 
            display: flex; 
            gap: 5px; 
            width: 100%; 
        }

        input { 
            background: #fff; 
            border: none; 
            padding: 8px; 
            font-size: 14px; 
            font-weight: bold; 
            color: #333;
            outline: none;
            height: 40px;
            -webkit-appearance: none;
        }

        #userName { width: 85px; flex-shrink: 0; }
        #userMsg { flex: 1; min-width: 0; }
        .hp-field { display: none !important; }

        button { 
            background: #001529; 
            color: #fff; 
            border: none;
            padding: 0 15px; 
            height: 40px;
            cursor: pointer; 
            font-weight: bold;
        }

        #chat::-webkit-scrollbar { width: 6px; }
        #chat::-webkit-scrollbar-track { background: #001529; }
        #chat::-webkit-scrollbar-thumb { background: #fdf0c2; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="chat"></div>
    <div id="input-area">
        <div class="input-row">
            <input type="text" id="botCheck" class="hp-field" tabindex="-1" autocomplete="off">
            <input type="text" id="userName" placeholder="Name">
            <input type="text" id="userMsg" placeholder="Nachricht..." onkeypress="if(event.key === 'Enter') send()">
            <button id="sendBtn" onclick="send()">Senden</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCq3ryTxKbb3WGi06jH8EWAy6avUNw4Nuc",
        authDomain: "meinwebchat.firebaseapp.com",
        databaseURL: "https://meinwebchat-default-rtdb.europe-west1.firebasedatabase.app/",
        projectId: "meinwebchat",
        storageBucket: "meinwebchat.firebasestorage.app",
        messagingSenderId: "1026092671512",
        appId: "1:1026092671512:web:1b38e71d21be7d3983196d"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let isLocked = false;
    let lastSentMessage = "";

    if (!sessionStorage.getItem('chat_user_sid')) {
        sessionStorage.setItem('chat_user_sid', 'sid_' + Math.random().toString(36).substr(2, 9));
    }
    const mySessionId = sessionStorage.getItem('chat_user_sid');

    const blacklist = [
        "arsch", "idiot", "wichser", "schlampe", "hure", "bastard", "depp", "missgeburt", "pisser", "fotze", "nazi", "hitler", "neger", "penis", "vagina", "fick",
        "hurensohn", "arschloch", "wixxer", "schwachkopf", "vollidiot", "spast", "spasti", "missgeburt", "nutte", "fotzenknecht", "pissnelke", "sauhund", "schweinehund",
        "wichsgesicht", "kackbratze", "pissgesicht", "vollpfosten", "vollspast", "versager", "verpisst", "lutsch", "lutscher", "huren", "drecksau", "schandmaul",
        "kanake", "fotzkopf", "pimmel", "pimmelberger", "pimmellutscher", "saftsack"
    ]; 

    // Erweiterte Liste der geschützten Block-Namen (alle in Kleinbuchstaben für den Abgleich)
    const protectedNames = [
        "maurice", "yvonne", "trl", "talknow", "total reality live", "totalrealitylive",
        "milan", "kiki", "hitler", "adolf hitler", "alice weidel", "björn höcke", "bjoern hoecke", "frauke petry"
    ];
    const secretCode = "_1104";

    function containsBadWords(text) {
        const lowerText = text.toLowerCase();
        return blacklist.some(word => lowerText.includes(word));
    }

    function cleanName(name) {
        return name.toLowerCase().replace(/[^a-zA-ZäöüÄÖÜß]/g, "");
    }

    function hasLetterSpam(text) {
        return /(.)\1{4,}/.test(text);
    }

    function scrollToBottom() {
        const chat = document.getElementById('chat');
        chat.scrollTop = chat.scrollHeight;
    }

    function send() {
        if (isLocked) return;
        const nameInput = document.getElementById('userName');
        const msgInput = document.getElementById('userMsg');
        const sendBtn = document.getElementById('sendBtn');
        
        let enteredName = nameInput.value.trim();
        const enteredMsg = msgInput.value.trim();

        if (enteredName !== "" && enteredMsg !== "") {
            
            if (enteredMsg.toLowerCase() === lastSentMessage.toLowerCase()) {
                msgInput.value = "";
                return;
            }

            let triggerShadowBan = false;
            if (containsBadWords(enteredMsg) || containsBadWords(enteredName) || hasLetterSpam(enteredMsg)) {
                triggerShadowBan = true;
            }

            // --- AUTHENTIFIZIERUNGSPRÜFUNG FÜR BLOCK-NAMEN ---
            let isVerifiedHost = false;
            let checkName = enteredName.toLowerCase();

            // Prüfen, ob die Eingabe mit dem geheimen Code endet
            if (checkName.endsWith(secretCode)) {
                const baseName = enteredName.substring(0, enteredName.length - secretCode.length);
                const cleanBase = baseName.trim().toLowerCase();

                if (protectedNames.includes(cleanBase)) {
                    isVerifiedHost = true;
                    enteredName = baseName.trim(); 
                    checkName = cleanBase;
                }
            } else {
                // Wenn kein Code eingegeben wurde, wird auch auf bereinigte Varianten geprüft
                const cleanedEnteredCheck = cleanName(enteredName);
                const isBlockedVariant = protectedNames.some(pName => {
                    const cleanedPName = cleanName(pName);
                    return cleanedEnteredCheck === cleanedPName || 
                           (cleanedEnteredCheck.startsWith(cleanedPName) && cleanedPName.length >= 3);
                });

                if (isBlockedVariant) {
                    alert("Dieser Name ist geschützt und kann von regulären Nutzern nicht verwendet werden.");
                    return;
                }
            }

            isLocked = true;
            sendBtn.style.opacity = "0.5";

            const cleanedEntered = cleanName(enteredName);

            db.ref("messages").limitToLast(50).once("value", (snapshot) => {
                let nameTakenByOther = false;

                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        const msgData = childSnapshot.val();
                        if (msgData && msgData.sid && msgData.name && !msgData.shadowBanned && msgData.sid !== mySessionId) {
                            const cleanedExisting = cleanName(msgData.name);
                            if (cleanedExisting === cleanedEntered || 
                                (cleanedEntered.startsWith(cleanedExisting) && cleanedExisting.length >= 3)) {
                                nameTakenByOther = true;
                            }
                        }
                    });
                }

                if (nameTakenByOther && !triggerShadowBan && !isVerifiedHost) {
                    alert("Dieser Name oder eine zu ähnliche Variante wird aktuell bereits verwendet. Bitte wähle einen eindeutigen Namen.");
                    isLocked = false;
                    sendBtn.style.opacity = "1";
                    return;
                }

                db.ref("messages").push().set({
                    name: enteredName,
                    text: enteredMsg,
                    time: Date.now(),
                    sid: mySessionId,
                    shadowBanned: triggerShadowBan,
                    isHost: isVerifiedHost
                });

                lastSentMessage = enteredMsg;
                msgInput.value = "";
                setTimeout(() => { isLocked = false; sendBtn.style.opacity = "1"; }, 3000);
            });
        }
    }

    db.ref("messages").limitToLast(50).on("value", (snapshot) => {
        const chat = document.getElementById('chat');
        chat.innerHTML = ""; 
        
        if (!snapshot.exists()) {
            return;
        }

        const firstOwners = {};

        snapshot.forEach((childSnapshot) => {
            const data = childSnapshot.val();
            if (data && data.name && data.sid && !data.shadowBanned) {
                const cleaned = cleanName(data.name);
                if (!firstOwners[cleaned]) {
                    firstOwners[cleaned] = data.sid;
                }
            }
        });

        snapshot.forEach((childSnapshot) => {
            const data = childSnapshot.val();
            if (data && data.name && data.text) {
                
                if (data.shadowBanned && data.sid !== mySessionId) {
                    return; 
                }

                const cleaned = cleanName(data.name);
                const div = document.createElement('div');
                div.className = 'msg';
                
                let badgeHTML = '';
                if (data.isHost) {
                    badgeHTML = '<span class="host-badge">Host</span>';
                } else if (!data.shadowBanned && firstOwners[cleaned] === data.sid) {
                    badgeHTML = '<span class="verify-badge">✔</span>';
                }
                
                div.innerHTML = `<b>${data.name}${badgeHTML}</b> ${data.text}`;
                chat.appendChild(div);
            }
        });
        
        setTimeout(scrollToBottom, 50);
    });
</script>
</body>
</html>
